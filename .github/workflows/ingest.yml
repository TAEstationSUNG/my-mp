name: 데이터 자동 수집

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST — 의원·법안·표결집계·태그(가벼움)
    - cron: "0 17 * * 0"   # 매주 일요일 02:00 KST — 개인별 표결 전체(무거움)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 버튼

# 겹쳐 도는 것 방지
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  # 매일: 빠른 갱신(새 발의법안·표결집계·이슈태그)
  daily:
    if: ${{ github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 의원 수집
        run: node scripts/ingest.mjs members
      - name: 법안 수집
        run: node scripts/ingest.mjs bills
      - name: 표결 집계 수집
        run: node scripts/ingest.mjs votesummary
      - name: 이슈 태그 재빌드
        run: node scripts/ingest.mjs tags

  # 주 1회: 개인별 표결 전체(법안당 API 1회라 느림)
  votes:
    if: ${{ github.event.schedule == '0 17 * * 0' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 표결 집계 먼저(표결 대상 목록)
        run: node scripts/ingest.mjs votesummary
      - name: 개인별 표결 전체 수집
        run: node scripts/ingest.mjs votes
